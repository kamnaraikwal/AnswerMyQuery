<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>React & Tailwind Todo App</title>
    <script src='https://cdn.tailwindcss.com'></script>
    <script src='https://unpkg.com/react@18/umd/react.development.js' crossorigin></script>
    <script src='https://unpkg.com/react-dom@18/umd/react-dom.development.js' crossorigin></script>
    <script src='https://unpkg.com/@babel/standalone/babel.min.js'></script>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css'>
</head>
<body class='bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4'>
    <div id='root' class='w-full max-w-md'></div>
    <script type='text/babel'>
        const { useState, useEffect } = React;
        function App() {
            const [todos, setTodos] = useState(() => {
                const saved = localStorage.getItem('todos');
                return saved ? JSON.parse(saved) : [
                    { id: 1, text: 'Create React + Tailwind Todo App', completed: true },
                    { id: 2, text: 'Open todo_tailwind.html in browser', completed: false }
                ];
            });
            const [input, setInput] = useState('');
            useEffect(() => { localStorage.setItem('todos', JSON.stringify(todos)); }, [todos]);
            const addTodo = (e) => {
                e.preventDefault();
                if (!input.trim()) return;
                setTodos([...todos, { id: Date.now(), text: input.trim(), completed: false }]);
                setInput('');
            };
            const toggleTodo = (id) => {
                setTodos(todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
            };
            const deleteTodo = (id) => { setTodos(todos.filter(t => t.id !== id)); };
            return (
                <div class='bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700'>
                    <h1 class='text-2xl font-bold mb-4 flex items-center gap-2 text-blue-400'>
                        <i class='fa-solid fa-list-check'></i> Todo App
                    </h1>
                    <form onSubmit={addTodo} class='flex gap-2 mb-4'>
                        <input type='text' value={input} onChange={e=>setInput(e.target.value)} placeholder='Add new task...' class='flex-1 bg-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500' />
                        <button type='submit' class='bg-blue-500 hover:bg-blue-600 px-4 rounded-xl text-white font-bold transition-all'><i class='fa-solid fa-plus'></i></button>
                    </form>
                    <div class='space-y-2'>
                        {todos.map(t => (
                            <div key={t.id} class='flex items-center justify-between p-3 rounded-xl bg-slate-700/40 border border-slate-700'>
                                <div class='flex items-center gap-3'>
                                    <button onClick={()=>toggleTodo(t.id)} class={`w-5 h-5 rounded border flex items-center justify-center ${t.completed ? 'bg-emerald-500 border-emerald-500' : 'border-slate-500'}`}>
                                        {t.completed && <i class='fa-solid fa-check text-xs text-white'></i>}
                                    </button>
                                    <span class={`text-sm ${t.completed ? 'line-through text-slate-500' : ''}`}>{t.text}</span>
                                </div>
                                <button onClick={()=>deleteTodo(t.id)} class='text-slate-400 hover:text-rose-400'><i class='fa-regular fa-trash-can'></i></button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
